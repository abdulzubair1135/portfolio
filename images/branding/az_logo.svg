<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Premium Deep Linear Gradient -->
    <linearGradient id="azGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>
    <linearGradient id="neonAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5B8CFF"/>
      <stop offset="100%" stop-color="#3DDC84"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181A22"/>
      <stop offset="100%" stop-color="#0B0C10"/>
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#5B8CFF" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background Squircle with Precision Border -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGrad)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="4"/>

  <!-- High-Tech Accent Circuit Corner Notches -->
  <path d="M120 44 L160 44" stroke="url(#neonAccent)" stroke-width="4" stroke-linecap="round"/>
  <path d="M352 468 L392 468" stroke="url(#neonAccent)" stroke-width="4" stroke-linecap="round"/>

  <!-- Precision Monogram AZ -->
  <g filter="url(#subtleGlow)">
    <!-- Letter A (Left Apex & Left Stem) -->
    <path d="M216 116 L124 380 L188 380 L212 308 L284 308 L262 244 L232 244 L244 200 L272 116 Z" fill="url(#azGrad)"/>

    <!-- Letter Z (Interlocking Upper Bar, Diagonal Spine & Lower Base) -->
    <path d="M256 148 L388 148 L388 204 L294 332 L396 332 L384 380 L236 380 L336 244 L244 244 Z" fill="url(#neonAccent)"/>

    <!-- Dynamic Central Apex Core -->
    <polygon points="256,92 232,156 280,156" fill="#FFFFFF"/>
  </g>
</svg>
